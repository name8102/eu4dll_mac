name: Build and Release Mac x86_64

on:
  workflow_dispatch: # 开启手动触发按钮

permissions:
  contents: write # 赋予 Action 创建 Release 发布的写权限

jobs:
  build-and-release:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure CMake
        # 配置 CMake，生成目录为 build，设置为 Release 模式
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build Project
        # 执行编译
        run: cmake --build build --config Release --target eu4dll_tests eu4dll_manifest_tool

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify cpp-pinyin Static Link
        run: |
          otool -L build/libeu4dll_mac.dylib
          if otool -L build/libeu4dll_mac.dylib | grep -q 'libcpp-pinyin'; then
            echo "::error::libeu4dll_mac.dylib still depends on libcpp-pinyin.dylib"
            exit 1
          fi

      - name: Verify Architecture, Deployment Target, and Resources
        run: |
          test "$(lipo -archs build/libeu4dll_mac.dylib)" = "x86_64"
          test "$(lipo -archs build/tool/insert_dylib)" = "x86_64"
          test "$(lipo -archs build/tool/eu4dll_manifest_tool)" = "x86_64"
          vtool -show-build build/libeu4dll_mac.dylib | grep -Eq 'minos 11\.0'
          vtool -show-build build/tool/insert_dylib | grep -Eq 'minos 11\.0'
          vtool -show-build build/tool/eu4dll_manifest_tool | grep -Eq 'minos 11\.0'
          test "$(find build/chinese_dict -type f | wc -l | tr -d ' ')" -eq 12

      - name: CodeSign Ad-Hoc
        # 对编译产物进行 Ad-hoc 签名
        # --force 表示覆盖已有的签名(如果有的话)，--sign - 代表使用 adhoc(身份为短横线) 进行签名
        run: |
          codesign --force --sign - build/libeu4dll_mac.dylib
          codesign --force --sign - build/tool/insert_dylib
          codesign --force --sign - build/tool/eu4dll_manifest_tool

      - name: Prepare Package
        run: python3 scripts/package_release.py --platform macos --build-dir build --output eu4dll_mac_build_${{ github.run_number }}.zip

      - name: Generate Release Body
        run: |
          previous_tag="$(git describe --tags --match 'b*' --abbrev=0 2>/dev/null || true)"

          if [ -n "${previous_tag}" ]; then
            git log "${previous_tag}..HEAD" --pretty=format:'* %s' > release_body.md
          else
            git log HEAD --pretty=format:'* %s' > release_body.md
          fi

          if ! grep -q '^\* ' release_body.md; then
            echo "* No commits found." > release_body.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }} # 自动创建Tag
          name: Release build_${{ github.run_number }} # 发布标题
          body_path: release_body.md
          files: eu4dll_mac_build_${{ github.run_number }}.zip # 绑定的压缩包文件
